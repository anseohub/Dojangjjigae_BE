spring:
  datasource:
    url: jdbc:h2:file:./data/dojangjjigae;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed:
    # 최초 실행시 resources/data/places-seed.json 을 읽어 DB에 적재할지 여부
    enabled: true
