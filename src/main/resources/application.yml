spring:
  application:
    name: dojangjjigae-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE

server:
  port: ${PORT:8085}

app:
  cors:
    # 로컬 React 개발서버 + 배포된 Vercel 도메인. 배포 후 실제 Vercel 주소로 바꿔주세요.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  weather:
    api-key: ${OPENWEATHER_API_KEY:}
    # 천안시청 좌표
    lat: 36.8151
    lon: 127.1139
    # 날씨 결과를 저장해 두는 시간(분)
    cache-minutes: ${OPENWEATHER_CACHE_MINUTES:30}
  auth:
    # 공모전 심사용 테스트 계정 (이 계정만 로그인 가능)
    test-email: ${TEST_ACCOUNT_EMAIL:openapi@example.com}
    test-password: "${TEST_ACCOUNT_PASSWORD:2026openapi!}"
    nickname: 보리친구
  tourapi:
    # 한국관광공사 TourAPI 서비스키 (URL 인코딩된 값 그대로). 없으면 실시간 보강을 건너뜀.
    service-key: ${TOUR_API_SERVICE_KEY:}
    # 같은 요청 결과를 저장해 두는 시간(분). 0이면 캐시를 끄고 매번 호출.
    cache-minutes: ${TOUR_API_CACHE_MINUTES:360}
